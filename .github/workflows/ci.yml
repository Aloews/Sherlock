name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check agent patch policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_rust_agent_network.py' -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Check web client for WebAssembly
        if: hashFiles('crates/web/Cargo.toml') != ''
        run: cargo check -p sherlock-web --target wasm32-unknown-unknown
      - name: Install pinned Trunk web bundler
        if: hashFiles('crates/web/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trunk" "$HOME/.cargo/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trunk"
          binary="$(find "$RUNNER_TEMP/trunk" -type f -name trunk -perm -111 -print -quit)"
          test -n "$binary"
          install "$binary" "$HOME/.cargo/bin/trunk"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          trunk --version
      - name: Build browser application bundle
        if: hashFiles('crates/web/Cargo.toml') != ''
        working-directory: crates/web
        run: trunk build --release
      - name: Verify generated browser assets
        if: hashFiles('crates/web/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          test -s crates/web/dist/index.html
          wasm_file="$(find crates/web/dist -maxdepth 1 -type f -name '*.wasm' -size +0c -print -quit)"
          test -n "$wasm_file"
          js_file="$(find crates/web/dist -maxdepth 1 -type f -name '*.js' -size +0c -print -quit)"
          test -n "$js_file"
          echo "Verified browser entry, WASM module and JS loader."
      - name: Upload browser build artifact
        if: hashFiles('crates/web/Cargo.toml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-web-dist
          path: crates/web/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Release build
        run: cargo build --release --workspace
