name: Football Dynasty CI

on:
  pull_request:
    paths:
      - "services/football-dynasty/**"
      - "docs/football-dynasty/**"
      - "docs/MAP.md"
      - ".github/workflows/football-dynasty-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/football-dynasty/**"
      - ".github/workflows/football-dynasty-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-dynasty-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Rust checks and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_dynasty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_dynasty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/football_dynasty_test
    defaults:
      run:
        working-directory: services/football-dynasty
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt to both Rust workspaces
        run: |
          cargo fmt --manifest-path ../../Cargo.toml --all
          cargo fmt --manifest-path Cargo.toml --all
          if git -C ../.. diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git -C ../.. config user.name "github-actions[bot]"
          git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../.. add crates services/football-dynasty
          git -C ../.. commit -m "style: apply rustfmt to Rust workspaces"
          git -C ../.. push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run PostgreSQL-backed tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
